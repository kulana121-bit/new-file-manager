name: Build Release APK (R8)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Restore Release Keystore (PKCS12)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > $GITHUB_WORKSPACE/release-keystore.p12
          echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/release-keystore.p12" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Build Release APK (R8)
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Verify Release APK Exists
        run: |
          if [ ! -f "app/build/outputs/apk/release/app-release.apk" ]; then
            echo "Error: Release APK not found at app/build/outputs/apk/release/app-release.apk"
            exit 1
          fi
          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="release-${{ github.run_number }}-${{ github.run_attempt }}"
          gh release create "$TAG_NAME" \
            app/build/outputs/apk/release/app-release.apk \
            --title "Release $TAG_NAME" \
            --notes "New File Manager v1.0 — release build with R8" \
            --latest || true

      - name: Summary Report
        run: |
          echo "### Release Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Succeeded" >> $GITHUB_STEP_SUMMARY
          echo "- **Target APK**: \`app/build/outputs/apk/release/app-release.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **R8**: minify enabled (proven keep-all recipe)" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact**: \`release-apk\`" >> $GITHUB_STEP_SUMMARY
